name: Validate batch integrations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOUR_API_DECODING_KEY: ${{ secrets.TOUR_API_DECODING_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        id: step-1
      - uses: actions/setup-python@v5
        id: step-2
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
        id: step-3
      - run: python scripts/preflight.py
        id: step-4
      - uses: actions/upload-artifact@v4
        id: step-5
        if: always()
        with:
          name: batch-preflight-${{ github.run_id }}
          path: artifacts/preflight/report.json
          if-no-files-found: warn
      - name: Notify Telegram of workflow outcome
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo '::error::Telegram notification secrets are missing'
            exit 1
          fi
          if [[ "$JOB_STATUS" == success ]]; then
            message="✅ [FitTour] 배치 완료: $WORKFLOW_NAME"
          else
            failed_steps=$(jq -r 'to_entries | map(select(.value.outcome == "failure") | .key) | join(", ")' <<< "$STEP_RESULTS")
            message="🚨 [FitTour] 배치 실패 경보: $WORKFLOW_NAME / ${failed_steps:-job} 단계 에러 발생"
          fi
          result=$(curl --silent --show-error --fail-with-body --retry 3 --connect-timeout 10 --max-time 30 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"$'\n'"$RUN_URL" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")
          if ! jq -e '.ok == true' <<< "$result" > /dev/null; then
            echo '::error::Telegram rejected the workflow notification'
            exit 1
          fi
