name: Daily Tour Enrichment

on:
  schedule:
    # Equivalent to 0 17,19,21 * * *. Separate entries identify a delayed relay reliably.
    - cron: '0 17 * * *' # 02:00 KST: priority categories
    - cron: '0 19 * * *' # 04:00 KST: secondary categories and courses
    - cron: '0 21 * * *' # 06:00 KST: remaining places and failed retries
  workflow_dispatch:
    inputs:
      wave:
        description: 'Relay wave (cumulative daily ceilings: 40000 / 80000 / 100000 calls)'
        type: choice
        options: ['1', '2', '3']
        default: '3'
      category:
        description: 'Manual target category (all includes all eight categories)'
        type: choice
        options: ['all', '12', '14', '15', '28', '39', '32', '38', '25']
        default: 'all'
      limit:
        description: 'Maximum places to claim'
        type: number
        default: 25000
      max_seconds:
        description: 'Stop starting new place work after this many seconds'
        type: number
        default: 5400
      retry_failed:
        description: 'Also retry failed places (always enabled for wave 3)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fittour-tourapi-relay
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOUR_API_DECODING_KEY: ${{ secrets.TOUR_API_DECODING_KEY }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_WAVE: ${{ inputs.wave || '3' }}
      INPUT_CATEGORY: ${{ inputs.category || 'all' }}
      INPUT_LIMIT: ${{ inputs.limit || '25000' }}
      INPUT_SECONDS: ${{ inputs.max_seconds || '5400' }}
      INPUT_RETRY: ${{ inputs.retry_failed && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        id: step-1
      - uses: actions/setup-node@v4
        id: step-2
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        id: step-3
      - name: Run relay with a shared KST quota ledger
        id: run-relay-with-a-shared-kst-quota-ledger
        shell: bash
        run: |
          wave="$INPUT_WAVE"
          if [[ "$EVENT_NAME" == schedule ]]; then
            case "$SCHEDULE" in
              '0 17 * * *') wave=1 ;;
              '0 19 * * *') wave=2 ;;
              '0 21 * * *') wave=3 ;;
              *) echo 'Unrecognized relay schedule'; exit 1 ;;
            esac
          fi
          case "$wave" in
            1) categories='12,14,15,28'; ceiling=40000 ;;
            2) categories='39,32,38,25'; ceiling=80000 ;;
            3) categories='all'; ceiling=100000 ;;
            *) echo 'Invalid wave'; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then categories="$INPUT_CATEGORY"; fi
          args=(--max-seconds "$INPUT_SECONDS" --limit "$INPUT_LIMIT" --categories "$categories" --daily-limit "$ceiling")
          if [[ "$wave" == 3 || "$INPUT_RETRY" == true ]]; then args+=(--retry-failed); fi
          mkdir -p artifacts/tour-batch
          set +e
          npm run batch-tour-enrichment -- "${args[@]}" 2>&1 | tee artifacts/tour-batch/run.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" == 2 ]]; then
            echo 'Quota/runtime boundary reached; remaining work is deferred to a later relay.'
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
      - name: Upload dynamic population and outcome report
        id: upload-dynamic-population-and-outcome-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-enrichment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tour-batch/last-run.json
            artifacts/tour-batch/run.log
          if-no-files-found: warn
      - name: Notify Telegram of workflow outcome
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo '::error::Telegram notification secrets are missing'
            exit 1
          fi
          if [[ "$JOB_STATUS" == success ]]; then
            message="✅ [FitTour] 배치 완료: $WORKFLOW_NAME"
          else
            failed_steps=$(jq -r 'to_entries | map(select(.value.outcome == "failure") | .key) | join(", ")' <<< "$STEP_RESULTS")
            message="🚨 [FitTour] 배치 실패 경보: $WORKFLOW_NAME / ${failed_steps:-job} 단계 에러 발생"
          fi
          result=$(curl --silent --show-error --fail-with-body --retry 3 --connect-timeout 10 --max-time 30 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"$'\n'"$RUN_URL" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")
          if ! jq -e '.ok == true' <<< "$result" > /dev/null; then
            echo '::error::Telegram rejected the workflow notification'
            exit 1
          fi
