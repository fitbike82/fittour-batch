name: Daily Tour Enrichment

on:
  schedule:
    # Equivalent to 0 17,19,21 * * *. Separate entries identify a delayed relay reliably.
    - cron: '0 17 * * *' # 02:00 KST: priority categories
    - cron: '0 19 * * *' # 04:00 KST: secondary categories and courses
    - cron: '0 21 * * *' # 06:00 KST: remaining places and failed retries
  workflow_dispatch:
    inputs:
      wave:
        description: 'Relay wave (cumulative daily ceilings: 40000 / 80000 / 100000 calls)'
        type: choice
        options: ['1', '2', '3']
        default: '3'
      category:
        description: 'Manual target category (all includes all eight categories)'
        type: choice
        options: ['all', '12', '14', '15', '28', '39', '32', '38', '25']
        default: 'all'
      limit:
        description: 'Maximum places to claim'
        type: number
        default: 25000
      max_seconds:
        description: 'Stop starting new place work after this many seconds'
        type: number
        default: 5400
      retry_failed:
        description: 'Also retry failed places (always enabled for wave 3)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fittour-tourapi-relay
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOUR_API_DECODING_KEY: ${{ secrets.TOUR_API_DECODING_KEY }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_WAVE: ${{ inputs.wave || '3' }}
      INPUT_CATEGORY: ${{ inputs.category || 'all' }}
      INPUT_LIMIT: ${{ inputs.limit || '25000' }}
      INPUT_SECONDS: ${{ inputs.max_seconds || '5400' }}
      INPUT_RETRY: ${{ inputs.retry_failed && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run relay with a shared KST quota ledger
        shell: bash
        run: |
          wave="$INPUT_WAVE"
          if [[ "$EVENT_NAME" == schedule ]]; then
            case "$SCHEDULE" in
              '0 17 * * *') wave=1 ;;
              '0 19 * * *') wave=2 ;;
              '0 21 * * *') wave=3 ;;
              *) echo 'Unrecognized relay schedule'; exit 1 ;;
            esac
          fi
          case "$wave" in
            1) categories='12,14,15,28'; ceiling=40000 ;;
            2) categories='39,32,38,25'; ceiling=80000 ;;
            3) categories='all'; ceiling=100000 ;;
            *) echo 'Invalid wave'; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then categories="$INPUT_CATEGORY"; fi
          args=(--max-seconds "$INPUT_SECONDS" --limit "$INPUT_LIMIT" --categories "$categories" --daily-limit "$ceiling")
          if [[ "$wave" == 3 || "$INPUT_RETRY" == true ]]; then args+=(--retry-failed); fi
          mkdir -p artifacts/tour-batch
          set +e
          npm run batch-tour-enrichment -- "${args[@]}" 2>&1 | tee artifacts/tour-batch/run.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" == 2 ]]; then
            echo 'Quota/runtime boundary reached; remaining work is deferred to a later relay.'
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
      - name: Upload dynamic population and outcome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-enrichment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tour-batch/last-run.json
            artifacts/tour-batch/run.log
          if-no-files-found: warn
