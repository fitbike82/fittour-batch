name: Daily master catalog sync
on:
  schedule:
    - cron: '0 16 * * *' # 01:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Daily modified-place upsert or one-off full nationwide catalog'
        type: choice
        options: ['daily', 'full']
        default: 'daily'
permissions:
  contents: read
concurrency:
  group: fittour-tourapi-relay
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOUR_API_DECODING_KEY: ${{ secrets.TOUR_API_DECODING_KEY }}
      CATALOG_MODE: ${{ inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@v4
        id: step-1
      - uses: actions/setup-node@v4
        id: step-2
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        id: step-3
      - name: Refresh master before the detail relays
        id: refresh-master-before-the-detail-relays
        shell: bash
        run: |
          command='sync:daily-master'
          if [[ "$CATALOG_MODE" == full ]]; then command='sync:master'; fi
          mkdir -p artifacts/tour-batch
          set +e
          npm run "$command" 2>&1 | tee artifacts/tour-batch/run.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" == 2 ]]; then
            echo 'Daily quota exhausted; checkpoint retained for a later retry.'
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
      - name: Upload dynamic master report
        id: upload-dynamic-master-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tour-batch/last-run.json
            artifacts/tour-batch/run.log
          if-no-files-found: warn
      - name: Notify Telegram of workflow outcome
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo '::error::Telegram notification secrets are missing'
            exit 1
          fi
          if [[ "$JOB_STATUS" == success ]]; then
            message="✅ [FitTour] 배치 완료: $WORKFLOW_NAME"
          else
            failed_steps=$(jq -r 'to_entries | map(select(.value.outcome == "failure") | .key) | join(", ")' <<< "$STEP_RESULTS")
            message="🚨 [FitTour] 배치 실패 경보: $WORKFLOW_NAME / ${failed_steps:-job} 단계 에러 발생"
          fi
          result=$(curl --silent --show-error --fail-with-body --retry 3 --connect-timeout 10 --max-time 30 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"$'\n'"$RUN_URL" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")
          if ! jq -e '.ok == true' <<< "$result" > /dev/null; then
            echo '::error::Telegram rejected the workflow notification'
            exit 1
          fi
